name: Build Demo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore $HOME/demo.keystore \
            -alias demo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass demo1234 -keypass demo1234 \
            -dname "CN=GlassButtons Demo, OU=Demo, O=Demo, L=Demo, ST=Demo, C=CN"

      - name: 编译并签名 Demo Release APK
        run: |
          ./gradlew :demo:assembleRelease \
            -PKEYSTORE_FILE=$HOME/demo.keystore \
            -PKEYSTORE_PASSWORD=demo1234 \
            -PKEY_ALIAS=demo \
            -PKEY_PASSWORD=demo1234 \
            --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: demo/build/outputs/apk/release/*.apk
          retention-days: 30
