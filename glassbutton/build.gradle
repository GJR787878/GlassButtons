// 玻璃拟态按钮组件库模块
plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.gjr.glassbutton'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    // 纯 Android framework 实现，无任何第三方依赖
}

// JitPack 发布配置
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.GJR787878'
                artifactId = 'GlassButtons'
                version = '1.0.1'
                from components.release
            }
        }
    }
}
