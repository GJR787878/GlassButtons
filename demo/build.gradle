// 演示 App 模块
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gjr.glassbutton.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.gjr.glassbutton.demo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release 签名配置（从 Gradle 属性读取，CI 自动注入）
    signingConfigs {
        release {
            if (project.hasProperty('KEYSTORE_FILE')) {
                storeFile file(project.KEYSTORE_FILE)
                storePassword project.KEYSTORE_PASSWORD
                keyAlias project.KEY_ALIAS
                keyPassword project.KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation project(':glassbutton')
}
